name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-31 build-tools;36.0.0 ndk;27.2.12479018

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the Windows cross linker
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Test
        run: cargo test -p ftbridge_protocol

      - name: Build native core and stage the OpenXR loader
        run: pwsh client/build-native.ps1

      - name: Build Windows diagnostics tool
        run: cargo build --release -p ftbridge_cli --target x86_64-pc-windows-gnu

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FTBRIDGE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release keystore"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key (updates need a reinstall)"
          fi

      - name: Build APK
        env:
          FTBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FTBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FTBRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x client/gradlew
          client/gradlew -p client assembleRelease --no-daemon

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          STAGE=dist/FTBridge
          mkdir -p "$STAGE/tools"
          cp client/app/build/outputs/apk/release/app-release.apk "$STAGE/FTBridge.apk"
          cp packaging/windows/Setup.cmd packaging/windows/setup.ps1 packaging/windows/README.txt "$STAGE/"
          cp tools/provision.ps1 "$STAGE/"
          cp target/x86_64-pc-windows-gnu/release/vrcft-cli.exe "$STAGE/tools/"
          # cmd.exe wants CRLF
          sed -i 's/\r\?$/\r/' "$STAGE/Setup.cmd"
          (cd dist && zip -r "FTBridge-$VERSION-windows.zip" FTBridge)
          cp "$STAGE/FTBridge.apk" "dist/FTBridge-$VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: FTBridge-${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          FILES=(dist/FTBridge-$VERSION-windows.zip dist/FTBridge-$VERSION.apk)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "FT Bridge $GITHUB_REF_NAME" --generate-notes
          else
            # Rolling pre-release that always points at the latest commit on main
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest "${FILES[@]}" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Latest build ($VERSION)" \
              --notes "$(printf 'Automated build of commit %s.\n\n**Windows users:** download the zip, unzip it and double-click `Setup.cmd` with the headset connected over USB. See `README.txt` inside.\n\n`FTBridge-%s.apk` is the bare headset app for manual installation.' "$GITHUB_SHA" "$VERSION")"
