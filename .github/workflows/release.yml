name: Build

# Every push and pull request is built and the package uploaded as a workflow artifact.
# A GitHub Release is published only from a version tag (v1.2.3), see README "Releases".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(sed -n 's/^ftbridgeVersion=\(.*\)$/\1/p' client/gradle.properties | tr -d '\r')
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          echo "tag $TAG_VERSION, gradle.properties $GRADLE_VERSION, Cargo.toml $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the versions in client/gradle.properties and Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-31 build-tools;36.0.0 ndk;27.2.12479018

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the Windows cross linker
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Test
        run: cargo test -p ftbridge_protocol

      - name: Build native core and stage the OpenXR loader
        run: pwsh client/build-native.ps1

      - name: Build Windows diagnostics tool
        run: cargo build --release -p ftbridge_cli --target x86_64-pc-windows-gnu

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FTBRIDGE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release keystore"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key (updates need a reinstall)"
          fi

      - name: Build APKs (service and settings app)
        env:
          FTBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FTBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FTBRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x client/gradlew
          client/gradlew -p client assembleRelease --no-daemon

      - name: Package
        id: package
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          STAGE=dist/FTBridge
          mkdir -p "$STAGE/tools"
          cp client/app/build/outputs/apk/release/app-release.apk "$STAGE/FTBridge.apk"
          cp client/panel/build/outputs/apk/release/panel-release.apk "$STAGE/FTBridgeSettings.apk"
          cp packaging/windows/Setup.cmd packaging/windows/setup.ps1 packaging/windows/README.txt "$STAGE/"
          cp tools/provision.ps1 "$STAGE/"
          cp target/x86_64-pc-windows-gnu/release/vrcft-cli.exe "$STAGE/tools/"
          # cmd.exe wants CRLF
          sed -i 's/\r\?$/\r/' "$STAGE/Setup.cmd"
          (cd dist && zip -r "FTBridge-$VERSION-windows.zip" FTBridge)
          cp "$STAGE/FTBridge.apk" "dist/FTBridge-$VERSION.apk"
          cp "$STAGE/FTBridgeSettings.apk" "dist/FTBridgeSettings-$VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: FTBridge-${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          cat > dist/notes.md <<EOF
          ## Install (Windows)

          1. Download **FTBridge-$VERSION-windows.zip** below and unzip it.
          2. Enable USB debugging on the headset and connect it over USB.
          3. Double-click **Setup.cmd** and follow the messages.

          README.txt inside the zip has the full steps and troubleshooting.
          FTBridge-$VERSION.apk (service) and FTBridgeSettings-$VERSION.apk (settings app) are the
          bare headset apps for manual installation; install both.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "dist/FTBridge-$VERSION-windows.zip" "dist/FTBridge-$VERSION.apk" \
            "dist/FTBridgeSettings-$VERSION.apk" \
            --title "FT Bridge $GITHUB_REF_NAME" --notes-file dist/notes.md
